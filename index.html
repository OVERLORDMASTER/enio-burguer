<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enio Burger</title>
    <!-- Favicon (icono de la pestaña) -->
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="imagen/favicon-32.png">
    <link rel="apple-touch-icon" href="imagen/apple-touch-icon.png">
    <meta name="theme-color" content="#223b5d">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        enio: {
                            blue: '#223b5d',
                            red: '#b83a2b',
                            cream: '#fdfbf7',
                            creamDark: '#f5e6ca',
                            darkText: '#1a2942'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts: Bungee y Alfa Slab One para estilo retro/cartel -->
    <link
        href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Bungee&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fdfbf7;
            color: #1a2942;
        }

        .font-brand {
            font-family: 'Bungee', cursive, sans-serif;
        }

        .font-retro {
            font-family: 'Alfa Slab One', serif;
        }

        /* Efecto 3D: el envoltorio flota y la tarjeta interior se inclina con el ratón */
        .card-3d-container {
            perspective: 1200px;
            touch-action: pan-y;
        }

        .logo-float {
            transform-style: preserve-3d;
            animation: floatLogo 4s ease-in-out infinite;
        }

        .card-3d {
            transition: transform 0.25s ease-out;
            transform-style: preserve-3d;
            will-change: transform;
        }

        @keyframes floatLogo {

            0%,
            100% {
                transform: translateY(0) rotateX(0deg) rotateY(0deg);
            }

            50% {
                transform: translateY(-8px) rotateX(4deg) rotateY(-6deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .logo-float {
                animation: none;
            }

            .card-3d {
                transition: none;
            }
        }

        .retro-shadow-sm {
            box-shadow: 4px 4px 0px #223b5d;
        }
    </style>
</head>

<body class="bg-enio-cream min-h-screen flex flex-col justify-between">

    <!-- Header simplificado: Solo logo y nombre -->
    <header class="bg-enio-blue text-enio-cream sticky top-0 z-50 border-b-4 border-enio-red shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-24 sm:h-28 flex items-center justify-between">
            <div class="flex items-center space-x-3 sm:space-x-4">
                <div
                    class="w-16 h-16 sm:w-20 sm:h-20 rounded-full overflow-hidden border-2 border-enio-cream bg-white shadow-inner flex items-center justify-center">
                    <img src="imagen/logo.png" onerror="this.src='https://placehold.co/150x150/223b5d/fdfbf7?text=EB'"
                        alt="Enio Burger Logo" class="w-full h-full object-cover">
                </div>
                <span class="text-2xl sm:text-3xl font-bold tracking-wider font-brand text-enio-cream">ENIO
                    BURGER</span>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="flex-grow pb-16">

        <!-- Hero / Sección Central Circular con Logo 3D -->
        <section class="py-10 px-4 sm:px-6 lg:px-8 bg-gradient-to-b from-enio-blue/10 to-transparent">
            <div class="max-w-4xl mx-auto text-center">
                <!-- Texto de bienvenida exacto -->
                <h1
                    class="text-3xl sm:text-4xl lg:text-5xl font-retro text-enio-blue mb-8 tracking-wide drop-shadow-sm">
                    Bienvenidos a Enio Burger
                </h1>

                <!-- Contenedor Circular con oscilación 3D -->
                <div class="card-3d-container inline-block p-6 sm:p-8" id="logoCardContainer">
                    <div class="logo-float">
                        <div id="logoCard"
                            class="card-3d w-72 h-72 sm:w-96 sm:h-96 lg:w-[26rem] lg:h-[26rem] rounded-full border-4 border-enio-red bg-white overflow-hidden shadow-2xl relative mx-auto flex items-center justify-center p-2 ring-8 ring-enio-blue/20">
                            <img src="imagen/logo.png"
                                onerror="this.src='https://placehold.co/400x400/223b5d/fdfbf7?text=ENIO+BURGER'"
                                alt="Logo Principal Enio Burger" class="w-full h-full object-cover rounded-full">
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Nuestros productos -->
        <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6">
            <h2 class="text-2xl sm:text-3xl lg:text-4xl font-retro text-enio-blue text-center mb-8 tracking-wide">
                Nuestros productos
            </h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8" id="productsGrid">

                <!-- Producto 1: Hamburguesa -->
                <div
                    class="product-card bg-white rounded-2xl border-2 border-enio-blue overflow-hidden retro-shadow-sm flex flex-col justify-between transition-transform hover:-translate-y-1">
                    <div class="relative aspect-square bg-slate-100 overflow-hidden">
                        <img src="imagen/productos/hamburguesa.jpeg"
                            onerror="this.src='https://placehold.co/400x300/223b5d/fdfbf7?text=Producto'"
                            alt="Hamburguesa" loading="lazy" class="w-full h-full object-cover">
                    </div>
                    <div class="p-5 flex-grow flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="text-xl font-bold text-enio-blue font-brand text-sm">Hamburguesa</h3>
                            </div>
                            <p class="text-slate-600 text-sm mb-4">
                                Descripción del producto.
                            </p>
                        </div>
                    </div>
                </div>

                <!-- Producto 2: Perro Caliente -->
                <div
                    class="product-card bg-white rounded-2xl border-2 border-enio-blue overflow-hidden retro-shadow-sm flex flex-col justify-between transition-transform hover:-translate-y-1">
                    <div class="relative aspect-square bg-slate-100 overflow-hidden">
                        <img src="imagen/productos/perro.jpeg"
                            onerror="this.src='https://placehold.co/400x300/223b5d/fdfbf7?text=Producto'"
                            alt="Perro Caliente" loading="lazy" class="w-full h-full object-cover">
                    </div>
                    <div class="p-5 flex-grow flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="text-xl font-bold text-enio-blue font-brand text-sm">Perro Caliente</h3>
                            </div>
                            <p class="text-slate-600 text-sm mb-4">
                                Descripción del producto.
                            </p>
                        </div>
                    </div>
                </div>

                <!-- Producto 3: Parrilla -->
                <div
                    class="product-card bg-white rounded-2xl border-2 border-enio-blue overflow-hidden retro-shadow-sm flex flex-col justify-between transition-transform hover:-translate-y-1">
                    <div class="relative aspect-square bg-slate-100 overflow-hidden">
                        <img src="imagen/productos/parrilla.jpeg"
                            onerror="this.src='https://placehold.co/400x300/223b5d/fdfbf7?text=Producto'"
                            alt="Parrilla" loading="lazy" class="w-full h-full object-cover">
                    </div>
                    <div class="p-5 flex-grow flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="text-xl font-bold text-enio-blue font-brand text-sm">Parrilla</h3>
                            </div>
                            <p class="text-slate-600 text-sm mb-4">
                                Descripción del producto.
                            </p>
                        </div>
                    </div>
                </div>

                <!-- Producto 4: Pepitos -->
                <div
                    class="product-card bg-white rounded-2xl border-2 border-enio-blue overflow-hidden retro-shadow-sm flex flex-col justify-between transition-transform hover:-translate-y-1">
                    <div class="relative aspect-square bg-enio-blue flex items-center justify-center">
                        <span class="font-retro text-enio-cream/80 text-xl tracking-wide">Próximamente</span>
                    </div>
                    <div class="p-5 flex-grow flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="text-xl font-bold text-enio-blue font-brand text-sm">Pepitos</h3>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </section>

    </main>

    <script>
        // ---------- Efecto 3D: el logo sigue al ratón y gira hacia los lados ----------
        const container = document.getElementById('logoCardContainer');
        const card = document.getElementById('logoCard');

        function inclinar(clientX, clientY) {
            const rect = container.getBoundingClientRect();
            const px = Math.max(-0.5, Math.min(0.5, (clientX - rect.left) / rect.width - 0.5));
            const py = Math.max(-0.5, Math.min(0.5, (clientY - rect.top) / rect.height - 0.5));
            card.style.transform =
                `translateX(${px * 50}px) rotateY(${px * 60}deg) rotateX(${-py * 16}deg) scale(1.04)`;
        }

        function soltar() {
            card.style.transform = 'translateX(0) rotateY(0deg) rotateX(0deg) scale(1)';
        }

        if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
            container.addEventListener('pointermove', (e) => inclinar(e.clientX, e.clientY));
            container.addEventListener('pointerleave', soltar);
            container.addEventListener('pointerup', soltar);
            container.addEventListener('pointercancel', soltar);
        }

    </script>
</body>

</html>
